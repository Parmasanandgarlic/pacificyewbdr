name: BDR Production Quality Gates

on:
  pull_request:
    paths:
      - 'bdr_agent.py'
      - 'bdr_runner.py'
      - 'lead_intelligence.py'
      - 'growth_engine.py'
      - 'production_hardening.py'
      - 'streaming_growth.py'
      - 'discovery_reliability.py'
      - 'email_copy_intelligence.py'
      - 'outreach_compliance.py'
      - 'run_reliability.py'
      - 'schedule_control.py'
      - 'auto_schedule.py'
      - 'production_streaming.py'
      - 'tests/test_*.py'
      - '.github/workflows/bdr.yml'
      - '.github/workflows/bdr-live.yml'
      - '.github/workflows/bdr-immediate-kickstart.yml'
      - '.github/workflows/bdr-production-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile every production module
        run: |
          python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py growth_engine.py production_hardening.py streaming_growth.py discovery_reliability.py email_copy_intelligence.py outreach_compliance.py run_reliability.py schedule_control.py auto_schedule.py production_streaming.py
      - name: Run all production unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
