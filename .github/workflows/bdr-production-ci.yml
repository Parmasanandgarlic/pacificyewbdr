name: BDR Production Quality Gates

on:
  pull_request:
    paths:
      - 'bdr_agent.py'
      - 'bdr_runner.py'
      - 'lead_intelligence.py'
      - 'growth_engine.py'
      - 'production_hardening.py'
      - 'tests/test_lead_intelligence.py'
      - 'tests/test_growth_engine.py'
      - 'tests/test_production_hardening.py'
      - '.github/workflows/bdr.yml'
      - '.github/workflows/bdr-immediate-kickstart.yml'
      - '.github/workflows/bdr-production-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile every production module
        run: |
          python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py growth_engine.py
          if [[ -f production_hardening.py ]]; then python -m py_compile production_hardening.py; fi
      - name: Run all production unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
