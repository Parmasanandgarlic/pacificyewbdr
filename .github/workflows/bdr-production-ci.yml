name: BDR Production Quality Gates

on:
  pull_request:
    paths:
      - 'bdr_agent.py'
      - 'bdr_runner.py'
      - 'lead_intelligence.py'
      - 'tests/test_lead_intelligence.py'
      - '.github/workflows/bdr.yml'
      - '.github/workflows/bdr-production-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile production modules
        run: python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py
      - name: Run lead-intelligence tests
        run: python -m unittest discover -s tests -p 'test_lead_intelligence.py' -v
