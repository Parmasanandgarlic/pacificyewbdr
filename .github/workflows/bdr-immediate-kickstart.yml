name: Pacific Yew BDR Manual Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacific-yew-bdr-validation
  cancel-in-progress: true

jobs:
  validate-bdr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate production worker without delivery
        run: |
          python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py growth_engine.py production_hardening.py streaming_growth.py email_copy_intelligence.py outreach_compliance.py production_streaming.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          echo "Manual workflow is validation-only. Production delivery occurs only in the four scheduled weekday windows."
