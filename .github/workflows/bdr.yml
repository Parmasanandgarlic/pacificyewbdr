name: Pacific Yew BDR Agent

on:
  schedule:
    # A frequent heartbeat is deliberately used instead of four brittle exact
    # cron events. Run Control selects the oldest unfinished Pacific slot that
    # is still inside its recovery window and permits it exactly once.
    # Both PDT and PST business hours are covered by the UTC range.
    - cron: '13,43 15-22 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdr.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pacific-yew-bdr-production
  cancel-in-progress: false

jobs:
  run-bdr:
    if: >
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.body == '/bdr-recover-due-slot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate complete production worker
        run: |
          python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py growth_engine.py production_hardening.py streaming_growth.py email_copy_intelligence.py outreach_compliance.py run_reliability.py schedule_control.py auto_schedule.py production_streaming.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Write Google service-account JSON
        run: |
          set -euo pipefail
          test -n "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}"
          mkdir -p creds
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > creds/service_account.json
          python -c "import json; json.load(open('creds/service_account.json')); print('service_account.json is valid JSON')"

      - name: Resolve and claim due Pacific slot
        id: slot
        env:
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          RUN_CONTROL_TAB: 'Run Control'
        shell: bash
        run: |
          set -euo pipefail
          event_name='${{ github.event_name }}'

          if [[ "$event_name" == 'workflow_dispatch' ]]; then
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'run_slot=manual' >> "$GITHUB_OUTPUT"
            echo 'send_limit=0' >> "$GITHUB_OUTPUT"
            echo 'attempt_id=' >> "$GITHUB_OUTPUT"
            echo 'reason=manual_delivery_disabled' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$event_name" != 'schedule' && "$event_name" != 'push' && "$event_name" != 'issue_comment' ]]; then
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'run_slot=none' >> "$GITHUB_OUTPUT"
            echo 'send_limit=0' >> "$GITHUB_OUTPUT"
            echo 'attempt_id=' >> "$GITHUB_OUTPUT"
            echo 'reason=unsupported_event' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python auto_schedule.py --run-cap 8

      - name: Report recovery heartbeat accepted
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_SLOT: ${{ steps.slot.outputs.run_slot }}
          SEND_LIMIT: ${{ steps.slot.outputs.send_limit }}
          SHOULD_RUN: ${{ steps.slot.outputs.should_run }}
          REASON: ${{ steps.slot.outputs.reason }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_RUN" == 'true' ]]; then
            body="BDR recovery heartbeat accepted. Slot: ${RUN_SLOT}. Remaining slot capacity: ${SEND_LIMIT}. Live run: ${RUN_URL}"
          else
            body="BDR recovery heartbeat did not claim a send. Reason: ${REASON}. Live run: ${RUN_URL}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body"

      - name: Run compliant streaming BDR worker
        if: steps.slot.outputs.should_run == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
          OPENROUTER_FALLBACK_MODEL: 'openrouter/free'
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          REPLY_TO_EMAIL: ${{ secrets.REPLY_TO_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_INDIVIDUAL: ${{ secrets.SENDER_INDIVIDUAL }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
          SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
          SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          BDR_RUN_SLOT: ${{ steps.slot.outputs.run_slot }}
          BDR_ATTEMPT_ID: ${{ steps.slot.outputs.attempt_id }}
          SEND_LIMIT: ${{ steps.slot.outputs.send_limit }}
          DAILY_SEND_CAP: '32'
          INITIAL_OUTREACH_ONLY: 'true'
          ALLOW_MANUAL_DELIVERY: 'false'
          ONE_TOUCH_LEDGER_TAB: 'One Touch Ledger'
          RUN_CONTROL_TAB: 'Run Control'
          SEND_MIN_INTERVAL_SECONDS: '18'
          SEND_JITTER_SECONDS: '12'
          QUERIES_PER_RUN: '24'
          MAX_QUERIES_PER_RUN: '72'
          RESULTS_PER_QUERY: '10'
          DISCOVERY_BUDGET_SECONDS: '2700'
          STREAM_BATCH_QUALIFIED: '2'
          STREAM_BATCH_SIZE: '8'
          STREAM_MAX_FLUSH_SECONDS: '240'
        run: python production_streaming.py

      - name: Record no-op scheduler heartbeat
        if: steps.slot.outputs.should_run != 'true'
        run: |
          echo "No delivery was due for this heartbeat: ${{ steps.slot.outputs.reason }}"

      - name: Report recovery heartbeat result
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_SLOT: ${{ steps.slot.outputs.run_slot }}
          SHOULD_RUN: ${{ steps.slot.outputs.should_run }}
          REASON: ${{ steps.slot.outputs.reason }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_RUN" == 'true' ]]; then
            body="BDR recovery heartbeat finished with job status ${JOB_STATUS}. Slot: ${RUN_SLOT}. Run details: ${RUN_URL}"
          else
            body="BDR recovery heartbeat finished without delivery. Reason: ${REASON}. Job status: ${JOB_STATUS}. Run details: ${RUN_URL}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body"
