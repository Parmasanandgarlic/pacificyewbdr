name: Pacific Yew BDR Agent

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bdr.yml'
  schedule:
    # DST-aware 2:30am Pacific run. Both UTC slots are scheduled; the runtime
    # guard below permits only the one that is actually 02:30 in Vancouver.
    - cron: '30 9 * * 1-5'
    - cron: '30 10 * * 1-5'
    # Existing daytime windows. GitHub cron is UTC; these are 8am, 11am,
    # and 2pm while British Columbia is on daylight time.
    - cron: '0 15 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

# Never allow two scheduled runs to overlap and reserve the same approval queue.
concurrency:
  group: pacific-yew-bdr-production
  cancel-in-progress: false

jobs:
  run-bdr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate lead intelligence
        run: |
          python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py
          python -m unittest discover -s tests -p 'test_lead_intelligence.py' -v

      - name: Write Google service-account JSON
        run: |
          mkdir -p creds
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > creds/service_account.json
          python -c "import json; json.load(open('creds/service_account.json')); print('service_account.json is valid JSON')"

      - name: Run BDR Agent
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          REPLY_TO_EMAIL: ${{ secrets.REPLY_TO_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_INDIVIDUAL: ${{ secrets.SENDER_INDIVIDUAL }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
          SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
          SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          # Controlled production volume: 8 per window x 4 weekday windows = 32/day max.
          SEND_LIMIT: '8'
          QUERIES_PER_RUN: '24'
          RESULTS_PER_QUERY: '10'
        shell: bash
        run: |
          set -euo pipefail
          event_name='${{ github.event_name }}'
          event_schedule='${{ github.event.schedule }}'
          if [[ "$event_name" == "schedule" && \
                ( "$event_schedule" == "30 9 * * 1-5" || "$event_schedule" == "30 10 * * 1-5" ) ]]; then
            local_time="$(TZ=America/Vancouver date +%H:%M)"
            if [[ "$local_time" != "02:30" ]]; then
              echo "Skipping duplicate DST slot; Vancouver local time is $local_time."
              exit 0
            fi
          fi
          python bdr_runner.py
