name: Pacific Yew BDR Agent

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bdr.yml'
  schedule:
    # Three weekday windows spread outreach through the Lower Mainland workday.
    # GitHub cron is UTC; these correspond to 8am, 11am, and 2pm PDT.
    - cron: '0 15 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

# Never allow two scheduled runs to overlap and reserve the same approval queue.
concurrency:
  group: pacific-yew-bdr-production
  cancel-in-progress: false

jobs:
  run-bdr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service-account JSON
        run: |
          mkdir -p creds
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > creds/service_account.json
          python -c "import json; json.load(open('creds/service_account.json')); print('service_account.json is valid JSON')"

      - name: Run BDR Agent
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # OPENROUTER_MODEL intentionally omitted — code defaults to "openrouter/free".
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          REPLY_TO_EMAIL: ${{ secrets.REPLY_TO_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_INDIVIDUAL: ${{ secrets.SENDER_INDIVIDUAL }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
          SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
          SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          # Controlled production volume: 8 per window x 3 weekday windows = 24/day max.
          # These workflow values intentionally override stale repository secrets.
          SEND_LIMIT: '8'
          QUERIES_PER_RUN: '24'
          RESULTS_PER_QUERY: '10'
        run: python bdr_agent.py
