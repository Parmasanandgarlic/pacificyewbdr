name: Pacific Yew BDR Agent

on:
  schedule:
    # Each Pacific local-time window has a PDT and PST candidate. The runtime
    # guard permits only the occurrence matching America/Vancouver local time.
    - cron: '0 10 * * 1-5' # 3am PDT candidate
    - cron: '0 11 * * 1-5' # 3am PST candidate
    - cron: '0 15 * * 1-5' # 8am PDT candidate
    - cron: '0 16 * * 1-5' # 8am PST candidate
    - cron: '0 18 * * 1-5' # 11am PDT candidate
    - cron: '0 19 * * 1-5' # 11am PST candidate
    - cron: '0 21 * * 1-5' # 2pm PDT candidate
    - cron: '0 22 * * 1-5' # 2pm PST candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacific-yew-bdr-production
  cancel-in-progress: false

jobs:
  run-bdr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate complete production worker
        run: |
          python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py growth_engine.py production_hardening.py streaming_growth.py production_streaming.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Write Google service-account JSON
        run: |
          mkdir -p creds
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > creds/service_account.json
          python -c "import json; json.load(open('creds/service_account.json')); print('service_account.json is valid JSON')"

      - name: Run streaming BDR production worker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
          OPENROUTER_FALLBACK_MODEL: 'openrouter/free'
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          REPLY_TO_EMAIL: ${{ secrets.REPLY_TO_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_INDIVIDUAL: ${{ secrets.SENDER_INDIVIDUAL }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
          SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
          SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SEND_LIMIT: '12'
          DAILY_SEND_CAP: '48'
          SEND_MIN_INTERVAL_SECONDS: '12'
          SEND_JITTER_SECONDS: '8'
          QUERIES_PER_RUN: '24'
          MAX_QUERIES_PER_RUN: '72'
          RESULTS_PER_QUERY: '10'
          DISCOVERY_BUDGET_SECONDS: '2700'
          STREAM_BATCH_QUALIFIED: '2'
          STREAM_BATCH_SIZE: '8'
          STREAM_MAX_FLUSH_SECONDS: '240'
        shell: bash
        run: |
          set -euo pipefail
          event_name='${{ github.event_name }}'
          event_schedule='${{ github.event.schedule }}'
          expected_time=''
          run_slot='manual'

          case "$event_schedule" in
            '0 10 * * 1-5'|'0 11 * * 1-5') expected_time='03:00'; run_slot='overnight' ;;
            '0 15 * * 1-5'|'0 16 * * 1-5') expected_time='08:00'; run_slot='morning' ;;
            '0 18 * * 1-5'|'0 19 * * 1-5') expected_time='11:00'; run_slot='midday' ;;
            '0 21 * * 1-5'|'0 22 * * 1-5') expected_time='14:00'; run_slot='afternoon' ;;
          esac

          if [[ "$event_name" == 'schedule' ]]; then
            local_time="$(TZ=America/Vancouver date +%H:%M)"
            if [[ "$local_time" != "$expected_time" ]]; then
              echo "Skipping duplicate DST slot; Vancouver local time is $local_time, expected $expected_time."
              exit 0
            fi
          fi

          export BDR_RUN_SLOT="$run_slot"
          echo "Starting Pacific Yew streaming BDR slot=$BDR_RUN_SLOT"
          python production_streaming.py
