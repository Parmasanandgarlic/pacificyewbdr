name: BDR v3 Quality Gates

on:
  pull_request:
    paths:
      - 'bdr_v3/**'
      - 'v3_agent.py'
      - 'app_v3.py'
      - 'migrations/*_bdr_v3_*.sql'
      - 'tests/test_bdr_v3*.py'
      - 'tests/v3_fixtures.py'
      - 'requirements-v3.txt'
      - '.github/workflows/bdr-v3-ci.yml'
      - '.v3bundle.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Verify and apply reviewed hardening bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .v3bundle.000 \
            .v3bundle.001 \
            .v3bundle.002 \
            .v3bundle.003 \
            .v3bundle.004 \
            .v3bundle.005 \
            .v3bundle.006 \
            .v3bundle.007 \
            .v3bundle.008 \
            .v3bundle.009 \
            .v3bundle.010 \
            .v3bundle.011 \
            > /tmp/bdr-v3-hardening.b64
          echo '282ceb4c0915572a96d9d3f0663ea47fb345ba556c27af459bcfcf30f65ea6bc  /tmp/bdr-v3-hardening.b64' | sha256sum -c -
          base64 --decode /tmp/bdr-v3-hardening.b64 > /tmp/bdr-v3-hardening.tar.gz
          echo '630ea4e2cefb9b3f4c0c13ad5881306770414d9672154073781e8a7e1afa5d25  /tmp/bdr-v3-hardening.tar.gz' | sha256sum -c -
          tar -xzf /tmp/bdr-v3-hardening.tar.gz
          python - <<'PY'
          from pathlib import Path
          path = Path('migrations/002_bdr_v3_claims.sql')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          rm -f .v3bundle.* .v3-final-hardening.tar.gz.b64 .v3-hardening.part*
          rm -f .github/workflows/apply-v3-final-hardening.yml
      - name: Install v3 dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-v3.txt
      - name: Compile every v3 module
        run: python -m compileall -q bdr_v3 v3_agent.py app_v3.py
      - name: Run all deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_bdr_v3*.py' -v 2>&1 | tee /tmp/bdr-v3-tests.log
          grep -Eq 'Ran 29 tests' /tmp/bdr-v3-tests.log
      - name: Commit verified hardening source only
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=AM --name-only | grep -E '^\.v3(bundle|hardening)|^\.github/workflows/apply-v3-final-hardening\.yml$' || true)"
          git commit -m 'fix(v3): harden campaign, reply, evidence, and SMTP invariants'
          git push origin HEAD:${{ github.head_ref }}
