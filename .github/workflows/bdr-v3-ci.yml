name: BDR v3 Quality Gates

on:
  pull_request:
    paths:
      - 'bdr_v3/**'
      - 'v3_agent.py'
      - 'app_v3.py'
      - 'migrations/*_bdr_v3_*.sql'
      - 'tests/test_bdr_v3*.py'
      - 'tests/v3_fixtures.py'
      - 'requirements-v3.txt'
      - '.github/workflows/bdr-v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install v3 dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-v3.txt
      - name: Compile every v3 module
        run: python -m compileall -q bdr_v3 v3_agent.py app_v3.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -p 'test_bdr_v3*.py' -v
