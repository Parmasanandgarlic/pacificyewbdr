name: Pacific Yew BDR Live

on:
  schedule:
    # Frequent heartbeat. Run Control selects the oldest unfinished Pacific
    # slot still inside its recovery window and permits it exactly once.
    - cron: '13,43 15-22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    # Any production-runtime hotfix should immediately ask Run Control to
    # recover the still-due slot. Run Control remains the durable send gate.
    paths:
      - '.github/workflows/bdr-live.yml'
      - 'requirements.txt'
      - 'bdr_agent.py'
      - 'bdr_runner.py'
      - 'lead_intelligence.py'
      - 'growth_engine.py'
      - 'production_hardening.py'
      - 'streaming_growth.py'
      - 'discovery_reliability.py'
      - 'email_copy_intelligence.py'
      - 'fit_scoring_hotfix.py'
      - 'outreach_compliance.py'
      - 'run_reliability.py'
      - 'schedule_control.py'
      - 'auto_schedule.py'
      - 'production_streaming.py'
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: pacific-yew-bdr-production
  # Normal heartbeats never interrupt active delivery. Only the exact,
  # owner-authored recovery PR may replace a stale worker after a production
  # fix. Run Control reconciles any messages already recorded in Sent Ledger.
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/bdr-recovery-signal' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.title == 'BDR guarded recovery signal' &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    }}

jobs:
  run-bdr:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ops/bdr-recovery-signal' &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.title == 'BDR guarded recovery signal' &&
        (github.event.action != 'closed' || github.event.pull_request.merged == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout trusted production code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate complete production worker
        run: |
          python -m py_compile bdr_agent.py bdr_runner.py lead_intelligence.py growth_engine.py production_hardening.py streaming_growth.py discovery_reliability.py email_copy_intelligence.py fit_scoring_hotfix.py outreach_compliance.py run_reliability.py schedule_control.py auto_schedule.py production_streaming.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Write Google service-account JSON
        run: |
          set -euo pipefail
          test -n "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}"
          mkdir -p creds
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > creds/service_account.json
          python -c "import json; json.load(open('creds/service_account.json')); print('service_account.json is valid JSON')"

      - name: Resolve and claim due Pacific slot
        id: slot
        env:
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          RUN_CONTROL_TAB: 'Run Control'
        run: python auto_schedule.py --run-cap 8

      - name: Report heartbeat decision
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_ISSUE: '13'
          EVENT_NAME: ${{ github.event_name }}
          RUN_SLOT: ${{ steps.slot.outputs.run_slot }}
          SEND_LIMIT: ${{ steps.slot.outputs.send_limit }}
          SHOULD_RUN: ${{ steps.slot.outputs.should_run }}
          REASON: ${{ steps.slot.outputs.reason }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_RUN" == 'true' ]]; then
            body="BDR live heartbeat accepted. Event: ${EVENT_NAME}. Slot: ${RUN_SLOT}. Remaining slot capacity: ${SEND_LIMIT}. Live run: ${RUN_URL}"
          else
            body="BDR live heartbeat did not claim delivery. Event: ${EVENT_NAME}. Reason: ${REASON:-pre-claim failure}. Live run: ${RUN_URL}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${STATUS_ISSUE}/comments" -f body="$body"

      - name: Run compliant streaming BDR worker
        if: steps.slot.outputs.should_run == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
          APIFY_MAX_CALLS_PER_RUN: '12'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
          OPENROUTER_FALLBACK_MODEL: 'openrouter/free'
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          REPLY_TO_EMAIL: ${{ secrets.REPLY_TO_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_INDIVIDUAL: ${{ secrets.SENDER_INDIVIDUAL }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
          SENDER_WEBSITE: ${{ secrets.SENDER_WEBSITE }}
          SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          BDR_RUN_SLOT: ${{ steps.slot.outputs.run_slot }}
          BDR_ATTEMPT_ID: ${{ steps.slot.outputs.attempt_id }}
          SEND_LIMIT: ${{ steps.slot.outputs.send_limit }}
          DAILY_SEND_CAP: '32'
          INITIAL_OUTREACH_ONLY: 'true'
          ALLOW_MANUAL_DELIVERY: 'false'
          ONE_TOUCH_LEDGER_TAB: 'One Touch Ledger'
          RUN_CONTROL_TAB: 'Run Control'
          SEND_MIN_INTERVAL_SECONDS: '18'
          SEND_JITTER_SECONDS: '12'
          QUERIES_PER_RUN: '24'
          MAX_QUERIES_PER_RUN: '72'
          RESULTS_PER_QUERY: '10'
          DISCOVERY_BUDGET_SECONDS: '2700'
          STREAM_BATCH_QUALIFIED: '1'
          STREAM_BATCH_SIZE: '8'
          STREAM_MAX_FLUSH_SECONDS: '240'
        run: python production_streaming.py

      - name: Record no-op heartbeat
        if: steps.slot.outputs.should_run != 'true'
        run: |
          echo "No delivery due: ${{ steps.slot.outputs.reason }}"

      - name: Report heartbeat result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_ISSUE: '13'
          JOB_STATUS: ${{ job.status }}
          RUN_SLOT: ${{ steps.slot.outputs.run_slot }}
          SHOULD_RUN: ${{ steps.slot.outputs.should_run }}
          REASON: ${{ steps.slot.outputs.reason }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_RUN" == 'true' ]]; then
            body="BDR live heartbeat finished. Slot: ${RUN_SLOT}. Job status: ${JOB_STATUS}. Run details: ${RUN_URL}"
          else
            body="BDR live heartbeat finished without delivery. Reason: ${REASON:-pre-claim failure}. Job status: ${JOB_STATUS}. Run details: ${RUN_URL}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${STATUS_ISSUE}/comments" -f body="$body"
